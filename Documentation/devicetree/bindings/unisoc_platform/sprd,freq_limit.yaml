%YAML 1.2
---
$id: http://devicetree.org/schemas/unisoc_platform/sprd,freq_limit.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum Freq Limit Bindings

description:
 Freq Limit driver, which is used to generate freq-limit FS for each device.

properties:
  compatible:
    const: sprd,freq-limit

  sprd,device-sign:
    description:
      Flag to control whether cpufreq and devfreq freq limits are enabled,
      bit0 means cpufreq, bit1 means devfreq
    enum:
      - <0x0>
      - <0x1>
      - <0x2>
      - <0x3>

  sprd,devfreq-cells:
    description:
      Phandle to devfreq device if devfreq is enabled

required:
  - compatible
  - sprd,device-sign

additionalProperties: false

examples:
  - |
    freq_limit: freq-limit {
            compatible = "sprd,freq-limit";
            sprd,device-sign = <0x3>;
            sprd,device-cells = <&gpu>;
    };

